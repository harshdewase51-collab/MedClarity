[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-report-simplifier-backend"
version = "1.0.0"
description = "AI-powered clinical laboratory report parser reference range classifier and multilingual simplifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.30",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
